name: Refresh NJ Green Dash news feeds
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-industry-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch latest verified headlines
        run: node news-feed-fetch.js
      - name: Commit refreshed feeds when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh cannabis and psychedelics news feed cache"
            git push
          fi
